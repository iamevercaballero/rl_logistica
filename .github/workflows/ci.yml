name: CI

on:
  push:
    branches: [main, master, ever]
  pull_request:

jobs:
  backend:
    name: Backend — lint, build, test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: logistica-palets-backend
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: rl_test
          POSTGRES_PASSWORD: test_password_change_me
          POSTGRES_DB: logistica_palets_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U rl_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: logistica-palets-backend/package-lock.json
      # npm install (no ci) porque el package-lock todavía no incluye jest/ts-jest;
      # tras correrlo y commitear el lock actualizado, se puede pasar a `npm ci`.
      - run: npm install --no-audit --no-fund
      - run: npm run lint
      - run: npm run build
      - run: npm test
        env:
          NODE_ENV: test
          TEST_DB_HOST: localhost
          TEST_DB_PORT: 5432
          TEST_DB_USERNAME: rl_test
          TEST_DB_PASSWORD: test_password_change_me
          TEST_DB_DATABASE: logistica_palets_test

  frontend:
    name: Frontend — lint, build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: logistica-palets-frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: logistica-palets-frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      # `npm run build` corre `tsc -b` → type-check completo del frontend.
      - run: npm run build
