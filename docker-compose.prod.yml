# =============================================================================
# RL Logística — PRODUCCIÓN
# Uso:
#   docker compose -f docker-compose.prod.yml --env-file .env.prod up -d --build
#
# Arquitectura: mismo esquema que staging. `cloudflared` abre un túnel SALIENTE
# hacia Cloudflare, que termina TLS en su borde y enruta los hostnames públicos
# (app./api.) hasta frontend:8080 y backend:3000 por la red interna del compose.
# El 8080 no es un capricho: nginx corre sin privilegios y no puede tomar el 80.
# No hay Caddy ni certificados que renovar acá.
#
# Seguridad:
#  - La DB y Redis NO exponen puertos al host (solo red interna del compose).
#  - El VPS no necesita abrir 80 ni 443: el túnel sale, no entra. El único
#    puerto publicado es el 3000 del backend, y sólo en 127.0.0.1 para poder
#    diagnosticar desde el propio servidor.
#  - Secretos vienen de .env.prod (gitignored), nunca hardcodeados.
#  - La sección environment: del backend sobreescribe cualquier valor del
#    .env.prod para las variables críticas de seguridad (belt & suspenders).
#
# Antes de levantar: bash scripts/check-env.sh .env.prod
# =============================================================================

services:

  # ── PostgreSQL ────────────────────────────────────────────────────────────
  db:
    image: postgres:16-alpine
    container_name: rl_logistica_db_prod
    restart: unless-stopped
    env_file: [.env.prod]
    environment:
      # UTC-3 fijo, NO "America/Asuncion": ese nombre depende de que el
      # tzdata bundleado en la imagen conozca la Ley 7324 (derogó el horario
      # de verano en oct/2024). postgres:16-alpine quedó con un snapshot de
      # tzdata anterior a la ley, así que CURRENT_TIMESTAMP calculaba UTC-4 en
      # los meses que antes eran "invierno" — atrasando 1h (y a veces el día)
      # todo timestamp con default de DB: movements.date/createdAt, y
      # cualquier @CreateDateColumn/@UpdateDateColumn de TypeORM en toda la
      # app. Etc/GMT+3 (el signo va invertido por convención POSIX) es UTC-3
      # fijo en cualquier versión de tzdata — mismo criterio que
      # APP_TIME_ZONE en src/common/date.ts, para que este contenedor no
      # dependa de mantener su tzdata al día.
      TZ:   Etc/GMT+3
      PGTZ: Etc/GMT+3
    volumes:
      - postgres_data_prod:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [internal]
    # Sin 'ports': la base de datos NO es accesible desde el host.
    security_opt: [ "no-new-privileges:true" ]
    # El entrypoint de postgres arranca como root y baja a `postgres` por su
    # cuenta (verificado: los procesos del servidor corren como `postgres`).
    # Ese descenso necesita SETUID/SETGID, y ajustar el dueño del directorio de
    # datos necesita CHOWN/FOWNER/DAC_OVERRIDE. Todo lo demas se descarta.
    cap_drop: [ ALL ]
    cap_add: [ CHOWN, DAC_OVERRIDE, FOWNER, SETGID, SETUID ]
    deploy:
      resources:
        # Medido en reposo: 45 MB. El techo deja lugar para shared_buffers,
        # work_mem y los picos de un VACUUM o un indice, sin permitir que la
        # base se coma el VPS entero si una consulta se descontrola.
        limits:   { memory: 1g, cpus: "1.5" }
        reservations: { memory: 256m }
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "5" }

  # ── Redis ──────────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: rl_logistica_redis_prod
    restart: unless-stopped
    command: redis-server --save "" --appendonly no --maxmemory 128mb --maxmemory-policy allkeys-lru
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [internal]
    # Sin 'ports': Redis no expuesto al host en producción.
    security_opt: [ "no-new-privileges:true" ]
    # Mismo caso que postgres: el entrypoint baja a `redis` por su cuenta.
    cap_drop: [ ALL ]
    cap_add: [ CHOWN, DAC_OVERRIDE, SETGID, SETUID ]
    deploy:
      resources:
        # `--maxmemory 128mb` ya lo acota por dentro; el techo del contenedor
        # cubre el overhead del proceso y evita que un pico lo mate por OOM.
        limits:   { memory: 256m, cpus: "0.5" }
        reservations: { memory: 64m }
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

  # ── Backend ───────────────────────────────────────────────────────────────
  backend:
    build:
      context: ./logistica-palets-backend
      dockerfile: Dockerfile
    container_name: rl_logistica_backend_prod
    restart: unless-stopped
    env_file: [.env.prod]
    environment:
      # ── Overrides fijos (no pueden ser cambiados desde .env.prod) ──────────
      # Etc/GMT+3, no America/Asuncion — ver el comentario en el servicio `db`.
      TZ:                Etc/GMT+3
      # Redes internas del compose
      PORT:              3000
      DB_HOST:           db
      DB_PORT:           5432
      REDIS_HOST:        redis
      REDIS_PORT:        6379
      # Entorno — fuerza modo producción (pino JSON, cache, etc.)
      NODE_ENV:          production
      # Seguridad crítica — estos valores NO se sobreescriben aunque .env.prod
      # diga lo contrario. Doble candado para evitar accidentes.
      DB_SYNCHRONIZE:    "false"     # NUNCA synchronize en prod
      DB_MIGRATIONS_RUN: "true"      # aplica migrations al arrancar
      ALLOW_SEED:        "false"     # seed bloqueado en producción
      # Node no ve el límite del cgroup: por defecto dimensiona su heap contra
      # la RAM del host y sigue creciendo hasta que el kernel lo mata con
      # señal 9 — que es exactamente el `Exited (137)` que tenía el contenedor
      # de desarrollo. Con el techo declarado, el recolector actúa ANTES de
      # llegar al límite: el proceso se ralentiza en vez de morir.
      NODE_OPTIONS:      "--max-old-space-size=768"
      # Detrás del túnel la conexión la abre `cloudflared` — sin esto todos los
      # usuarios comparten una IP. Ver RL-M-09 y .env.prod.example.
      TRUST_PROXY:       "1"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "require('http').get('http://localhost:3000/api/health', r => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))"
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 40s
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      # Adjuntos y fotos de movimientos/remitos. SIN ESTO SE PIERDEN: el backend
      # los escribe en /app/uploads, que vive dentro del contenedor, así que
      # cualquier `--force-recreate` o rebuild de imagen los borra. No es un
      # riesgo teórico — es lo que pasa en cada despliegue. docker-compose.yml y
      # docker-compose.staging.yml ya tenían el volumen; producción, la única
      # donde los archivos son irrecuperables, era la que no lo tenía.
      - uploads_data_prod:/app/uploads
    networks: [internal]
    security_opt: [ "no-new-privileges:true" ]
    # La imagen ya corre como `node` (uid 1000) desde el arranque, así que no
    # hace falta devolverle ninguna capacidad: no necesita cambiar de usuario ni
    # tocar dueños. Es el servicio que procesa lo que sube un operador, así que
    # es donde más rinde recortar.
    cap_drop: [ ALL ]
    # Sistema de archivos de sólo lectura salvo lo que realmente escribe: los
    # adjuntos (volumen) y /tmp. Un atacante que logre escritura no puede dejar
    # nada persistente en la imagen.
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    deploy:
      resources:
        # 1 GB de techo contra 768 MB de heap declarado arriba: la diferencia
        # cubre el runtime de Node, los buffers de los archivos subidos (15 MB
        # por archivo) y el resto del proceso fuera del heap.
        limits:   { memory: 1g, cpus: "1.5" }
        reservations: { memory: 256m }
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "5" }

  # ── Frontend (React → Nginx) ───────────────────────────────────────────────
  frontend:
    build:
      context: ./logistica-palets-frontend
      dockerfile: Dockerfile
      args:
        # Estas URLs se inyectan en tiempo de build (import.meta.env)
        VITE_API_URL:  ${VITE_API_URL}
        VITE_WS_URL:   ${VITE_WS_URL}
    container_name: rl_logistica_frontend_prod
    restart: unless-stopped
    depends_on:
      - backend
    # Sin 'ports': lo expone cloudflared por la red interna. Para debug local
    # podés agregar temporalmente "127.0.0.1:8080:8080".
    #
    # OJO: nginx escucha en 8080, no en 80. El hostname público de la app en
    # Cloudflare Zero Trust tiene que apuntar a http://frontend:8080.
    networks: [internal]
    security_opt: [ "no-new-privileges:true" ]
    # La imagen sin privilegios ya corre como uid 101 y escucha en un puerto
    # alto, así que no necesita NET_BIND_SERVICE ni ninguna otra capacidad.
    cap_drop: [ ALL ]
    read_only: true
    # nginx escribe sus temporales y su pid; con el sistema de archivos de sólo
    # lectura hay que darle estos tmpfs o no arranca.
    tmpfs:
      - /tmp:size=16m,mode=1777
      - /var/cache/nginx:size=16m,mode=0755,uid=101,gid=101
      - /var/run:size=1m,mode=0755,uid=101,gid=101
    deploy:
      resources:
        # Medido en reposo: 11 MB. Sirve archivos estáticos, no crece.
        limits:   { memory: 128m, cpus: "0.5" }
        reservations: { memory: 32m }
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

  # ── Cloudflare Tunnel (TLS termina en el borde de Cloudflare) ──────────────
  # Reemplaza a Caddy, con el mismo criterio que staging. El túnel es una
  # conexión SALIENTE hacia Cloudflare: el VPS no necesita abrir 80 ni 443, que
  # es una superficie de ataque menos. El ruteo a los hostnames públicos
  # (app./api.) se configura en el dashboard de Cloudflare Zero Trust
  # (Networks → Tunnels → Public Hostname); acá sólo hace falta TUNNEL_TOKEN.
  #
  # El Caddyfile del repo queda como la alternativa documentada en DEPLOY.md
  # para un despliegue sin Cloudflare; este compose no lo usa.
  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: rl_logistica_cloudflared_prod
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${TUNNEL_TOKEN}
    depends_on:
      - backend
      - frontend
    networks: [internal]
    security_opt: [ "no-new-privileges:true" ]
    # Sólo abre una conexión saliente: no necesita ninguna capacidad.
    cap_drop: [ ALL ]
    read_only: true
    deploy:
      resources:
        limits:   { memory: 128m, cpus: "0.5" }
        reservations: { memory: 32m }
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

volumes:
  postgres_data_prod:
  uploads_data_prod:   # Adjuntos y fotos — ver el comentario en el servicio `backend`

networks:
  internal:
    driver: bridge
