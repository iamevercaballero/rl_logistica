# =============================================================================
# RL Logística — PRODUCCIÓN
# Uso:
#   docker compose -f docker-compose.prod.yml --env-file .env.prod up -d --build
#
# Seguridad:
#  - La DB NO expone puertos al host (solo red interna del compose).
#  - Backend y frontend se publican únicamente en 127.0.0.1, para que un
#    reverse proxy (Nginx/Traefik con SSL) en el host los enrute.
#    NUNCA exponer estos puertos directamente a internet sin TLS.
#  - Secretos vienen de .env.prod (gitignored), nunca hardcodeados.
#  - La sección environment: del backend sobreescribe cualquier valor del
#    .env.prod para las variables críticas de seguridad (belt & suspenders).
# =============================================================================

services:

  # ── PostgreSQL ────────────────────────────────────────────────────────────
  db:
    image: postgres:16-alpine
    container_name: rl_logistica_db_prod
    restart: unless-stopped
    env_file: [.env.prod]
    environment:
      # Sin esto Postgres corre en UTC — el backend ya trata todas las fechas
      # de forma explícita (ver src/common/date.ts), pero esto es defensa en
      # profundidad para cualquier función SQL que use la zona de la sesión.
      TZ:   America/Asuncion
      PGTZ: America/Asuncion
    volumes:
      - postgres_data_prod:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [internal]
    # Sin 'ports': la base de datos NO es accesible desde el host.

  # ── Redis ──────────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: rl_logistica_redis_prod
    restart: unless-stopped
    command: redis-server --save "" --appendonly no --maxmemory 128mb --maxmemory-policy allkeys-lru
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [internal]
    # Sin 'ports': Redis no expuesto al host en producción.

  # ── Backend ───────────────────────────────────────────────────────────────
  backend:
    build:
      context: ./logistica-palets-backend
      dockerfile: Dockerfile
    container_name: rl_logistica_backend_prod
    restart: unless-stopped
    env_file: [.env.prod]
    environment:
      # ── Overrides fijos (no pueden ser cambiados desde .env.prod) ──────────
      # Zona horaria del proceso — defensa en profundidad (ver nota en `db`).
      TZ:                America/Asuncion
      # Redes internas del compose
      PORT:              3000
      DB_HOST:           db
      DB_PORT:           5432
      REDIS_HOST:        redis
      REDIS_PORT:        6379
      # Entorno — fuerza modo producción (pino JSON, cache, etc.)
      NODE_ENV:          production
      # Seguridad crítica — estos valores NO se sobreescriben aunque .env.prod
      # diga lo contrario. Doble candado para evitar accidentes.
      DB_SYNCHRONIZE:    "false"     # NUNCA synchronize en prod
      DB_MIGRATIONS_RUN: "true"      # aplica migrations al arrancar
      ALLOW_SEED:        "false"     # seed bloqueado en producción
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "require('http').get('http://localhost:3000/api/health', r => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))"
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 40s
    ports:
      - "127.0.0.1:3000:3000"
    networks: [internal]

  # ── Frontend (React → Nginx) ───────────────────────────────────────────────
  frontend:
    build:
      context: ./logistica-palets-frontend
      dockerfile: Dockerfile
      args:
        # Estas URLs se inyectan en tiempo de build (import.meta.env)
        VITE_API_URL:  ${VITE_API_URL}
        VITE_WS_URL:   ${VITE_WS_URL}
    container_name: rl_logistica_frontend_prod
    restart: unless-stopped
    depends_on:
      - backend
    # Sin 'ports': el frontend lo expone Caddy por red interna. Para debug local
    # podés agregar temporalmente "127.0.0.1:8080:80".
    networks: [internal]

  # ── Caddy (reverse proxy + HTTPS automático) ───────────────────────────────
  caddy:
    image: caddy:2-alpine
    container_name: rl_logistica_caddy_prod
    restart: unless-stopped
    depends_on:
      - frontend
      - backend
    environment:
      APP_DOMAIN: ${APP_DOMAIN}
      API_DOMAIN: ${API_DOMAIN}
      ACME_EMAIL: ${ACME_EMAIL}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"   # HTTP/3 (QUIC)
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data       # certificados (persistentes — no perderlos)
      - caddy_config:/config
    networks: [internal]

volumes:
  postgres_data_prod:
  caddy_data:
  caddy_config:

networks:
  internal:
    driver: bridge
