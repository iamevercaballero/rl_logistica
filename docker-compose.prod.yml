# =============================================================================
# RL Logística — PRODUCCIÓN
# Uso:
#   docker compose -f docker-compose.prod.yml --env-file .env.prod up -d --build
#
# Arquitectura: mismo esquema que staging. `cloudflared` abre un túnel SALIENTE
# hacia Cloudflare, que termina TLS en su borde y enruta los hostnames públicos
# (app./api.) hasta frontend:80 y backend:3000 por la red interna del compose.
# No hay Caddy ni certificados que renovar acá.
#
# Seguridad:
#  - La DB y Redis NO exponen puertos al host (solo red interna del compose).
#  - El VPS no necesita abrir 80 ni 443: el túnel sale, no entra. El único
#    puerto publicado es el 3000 del backend, y sólo en 127.0.0.1 para poder
#    diagnosticar desde el propio servidor.
#  - Secretos vienen de .env.prod (gitignored), nunca hardcodeados.
#  - La sección environment: del backend sobreescribe cualquier valor del
#    .env.prod para las variables críticas de seguridad (belt & suspenders).
#
# Antes de levantar: bash scripts/check-env.sh .env.prod
# =============================================================================

services:

  # ── PostgreSQL ────────────────────────────────────────────────────────────
  db:
    image: postgres:16-alpine
    container_name: rl_logistica_db_prod
    restart: unless-stopped
    env_file: [.env.prod]
    environment:
      # UTC-3 fijo, NO "America/Asuncion": ese nombre depende de que el
      # tzdata bundleado en la imagen conozca la Ley 7324 (derogó el horario
      # de verano en oct/2024). postgres:16-alpine quedó con un snapshot de
      # tzdata anterior a la ley, así que CURRENT_TIMESTAMP calculaba UTC-4 en
      # los meses que antes eran "invierno" — atrasando 1h (y a veces el día)
      # todo timestamp con default de DB: movements.date/createdAt, y
      # cualquier @CreateDateColumn/@UpdateDateColumn de TypeORM en toda la
      # app. Etc/GMT+3 (el signo va invertido por convención POSIX) es UTC-3
      # fijo en cualquier versión de tzdata — mismo criterio que
      # APP_TIME_ZONE en src/common/date.ts, para que este contenedor no
      # dependa de mantener su tzdata al día.
      TZ:   Etc/GMT+3
      PGTZ: Etc/GMT+3
    volumes:
      - postgres_data_prod:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [internal]
    # Sin 'ports': la base de datos NO es accesible desde el host.

  # ── Redis ──────────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: rl_logistica_redis_prod
    restart: unless-stopped
    command: redis-server --save "" --appendonly no --maxmemory 128mb --maxmemory-policy allkeys-lru
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [internal]
    # Sin 'ports': Redis no expuesto al host en producción.

  # ── Backend ───────────────────────────────────────────────────────────────
  backend:
    build:
      context: ./logistica-palets-backend
      dockerfile: Dockerfile
    container_name: rl_logistica_backend_prod
    restart: unless-stopped
    env_file: [.env.prod]
    environment:
      # ── Overrides fijos (no pueden ser cambiados desde .env.prod) ──────────
      # Etc/GMT+3, no America/Asuncion — ver el comentario en el servicio `db`.
      TZ:                Etc/GMT+3
      # Redes internas del compose
      PORT:              3000
      DB_HOST:           db
      DB_PORT:           5432
      REDIS_HOST:        redis
      REDIS_PORT:        6379
      # Entorno — fuerza modo producción (pino JSON, cache, etc.)
      NODE_ENV:          production
      # Seguridad crítica — estos valores NO se sobreescriben aunque .env.prod
      # diga lo contrario. Doble candado para evitar accidentes.
      DB_SYNCHRONIZE:    "false"     # NUNCA synchronize en prod
      DB_MIGRATIONS_RUN: "true"      # aplica migrations al arrancar
      ALLOW_SEED:        "false"     # seed bloqueado en producción
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "require('http').get('http://localhost:3000/api/health', r => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))"
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 40s
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      # Adjuntos y fotos de movimientos/remitos. SIN ESTO SE PIERDEN: el backend
      # los escribe en /app/uploads, que vive dentro del contenedor, así que
      # cualquier `--force-recreate` o rebuild de imagen los borra. No es un
      # riesgo teórico — es lo que pasa en cada despliegue. docker-compose.yml y
      # docker-compose.staging.yml ya tenían el volumen; producción, la única
      # donde los archivos son irrecuperables, era la que no lo tenía.
      - uploads_data_prod:/app/uploads
    networks: [internal]

  # ── Frontend (React → Nginx) ───────────────────────────────────────────────
  frontend:
    build:
      context: ./logistica-palets-frontend
      dockerfile: Dockerfile
      args:
        # Estas URLs se inyectan en tiempo de build (import.meta.env)
        VITE_API_URL:  ${VITE_API_URL}
        VITE_WS_URL:   ${VITE_WS_URL}
    container_name: rl_logistica_frontend_prod
    restart: unless-stopped
    depends_on:
      - backend
    # Sin 'ports': lo expone cloudflared por la red interna. Para debug local
    # podés agregar temporalmente "127.0.0.1:8080:80".
    networks: [internal]

  # ── Cloudflare Tunnel (TLS termina en el borde de Cloudflare) ──────────────
  # Reemplaza a Caddy, con el mismo criterio que staging. El túnel es una
  # conexión SALIENTE hacia Cloudflare: el VPS no necesita abrir 80 ni 443, que
  # es una superficie de ataque menos. El ruteo a los hostnames públicos
  # (app./api.) se configura en el dashboard de Cloudflare Zero Trust
  # (Networks → Tunnels → Public Hostname); acá sólo hace falta TUNNEL_TOKEN.
  #
  # El Caddyfile del repo queda como la alternativa documentada en DEPLOY.md
  # para un despliegue sin Cloudflare; este compose no lo usa.
  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: rl_logistica_cloudflared_prod
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${TUNNEL_TOKEN}
    depends_on:
      - backend
      - frontend
    networks: [internal]

volumes:
  postgres_data_prod:
  uploads_data_prod:   # Adjuntos y fotos — ver el comentario en el servicio `backend`

networks:
  internal:
    driver: bridge
