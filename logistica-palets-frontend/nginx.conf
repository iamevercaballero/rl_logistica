server {
  # 8080: la imagen sin privilegios corre como uid 101 y no puede tomar el 80.
  listen 8080;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # No revelar la versión de nginx en headers/errores.
  server_tokens off;

  # --- Compresión gzip ------------------------------------------------------
  gzip on;
  gzip_vary on;
  gzip_min_length 1024;
  gzip_proxied any;
  gzip_comp_level 6;
  gzip_types
    text/plain text/css text/xml
    application/json application/javascript application/xml+rss
    application/atom+xml image/svg+xml font/ttf font/otf;

  # --- Cabeceras de seguridad -----------------------------------------------
  # HSTS y TLS los gestiona el borde (Cloudflare), no este contenedor: sirve
  # HTTP por la red interna del compose.
  #
  # El include se repite en CADA location que defina su propio `add_header`, y
  # no es descuido: nginx hereda los `add_header` del nivel superior sólo si el
  # nivel actual no define ninguno. Un `location` que agrega un `Cache-Control`
  # descarta, sin avisar, todas las cabeceras de seguridad del `server` — que es
  # exactamente lo que pasaba con `/assets/`, `/index.html`, `/sw.js` y
  # `/manifest.webmanifest`.
  include /etc/nginx/security-headers.conf;

  # --- Assets hasheados: cache agresivo (1 año, inmutable) ------------------
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    include /etc/nginx/security-headers.conf;   # obligatorio: ver arriba
    try_files $uri =404;
  }

  # --- index.html: nunca cachear (para que los deploys se reflejen) ---------
  location = /index.html {
    add_header Cache-Control "no-cache, no-store, must-revalidate";
    include /etc/nginx/security-headers.conf;   # obligatorio: ver arriba
    expires off;
  }

  # --- PWA: nunca cachear los archivos que deciden qué versión instalar ----
  # Cloudflare puede conservar una respuesta sin directiva durante horas. Si
  # `sw.js` queda viejo, intenta precachear assets hasheados que el despliegue
  # siguiente ya no contiene y el navegador continúa ejecutando la app previa.
  location = /sw.js {
    add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    add_header Service-Worker-Allowed "/" always;
    include /etc/nginx/security-headers.conf;   # obligatorio: ver arriba
    expires off;
  }

  location = /manifest.webmanifest {
    add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    include /etc/nginx/security-headers.conf;   # obligatorio: ver arriba
    expires off;
  }

  # --- SPA fallback ---------------------------------------------------------
  # Este bloque no define `add_header`, así que heredaría las del `server`. Se
  # incluye igual: depender de la herencia significa que agregar un
  # `Cache-Control` acá algún día apagaría la seguridad en silencio.
  location / {
    include /etc/nginx/security-headers.conf;
    try_files $uri $uri/ /index.html;
  }
}
