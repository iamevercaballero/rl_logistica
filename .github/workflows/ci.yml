name: CI

on:
  push:
    branches: [main, master, ever]
  pull_request:

jobs:
  backend:
    name: Backend — lint, build, test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: logistica-palets-backend
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: rl_test
          POSTGRES_PASSWORD: test_password_change_me
          POSTGRES_DB: logistica_palets_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U rl_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: logistica-palets-backend/package-lock.json
      - run: npm ci
      # Falla ante cualquier vulnerabilidad alta o crítica en las dependencias
      # que se despliegan. `--omit=dev` deja fuera las herramientas: una falla en
      # vite o typeorm-cli es real pero no viaja al servidor, y bloquear cada PR
      # por eso hace que el equipo aprenda a ignorar el CI.
      # Falla ante cualquier vulnerabilidad alta o crítica nueva en lo que se
      # despliega. Las excepciones aceptadas viven en el script, con su motivo.
      - run: node ../scripts/audit-gate.mjs
      - run: npm run lint
      - run: npm run build
      - run: npm test
        env:
          NODE_ENV: test
          TEST_DB_HOST: localhost
          TEST_DB_PORT: 5432
          TEST_DB_USERNAME: rl_test
          TEST_DB_PASSWORD: test_password_change_me
          TEST_DB_DATABASE: logistica_palets_test

  migrations:
    name: Backend — validar migraciones (DB limpia, synchronize=false)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: logistica-palets-backend
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: rl_test
          POSTGRES_PASSWORD: test_password_change_me
          POSTGRES_DB: logistica_migrations_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U rl_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: logistica-palets-backend/package-lock.json
      - run: npm ci
      # Camino REAL de producción: DB vacía + migraciones, sin synchronize.
      # Si InitialSchema estuviera incompleta (p.ej. faltara uuid-ossp), falla acá.
      - name: migration:run sobre DB vacía
        run: npm run migration:run
        env:
          DB_HOST: localhost
          DB_PORT: 5432
          DB_USERNAME: rl_test
          DB_PASSWORD: test_password_change_me
          DB_DATABASE: logistica_migrations_test
          DB_SYNCHRONIZE: "false"
          DB_MIGRATIONS_RUN: "false"
      # Segunda corrida: no debe haber migraciones pendientes (idempotencia).
      - name: migration:run de nuevo (idempotencia)
        run: npm run migration:run
        env:
          DB_HOST: localhost
          DB_PORT: 5432
          DB_USERNAME: rl_test
          DB_PASSWORD: test_password_change_me
          DB_DATABASE: logistica_migrations_test
          DB_SYNCHRONIZE: "false"
          DB_MIGRATIONS_RUN: "false"

  frontend:
    name: Frontend — lint, build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: logistica-palets-frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: logistica-palets-frontend/package-lock.json
      - run: npm ci
      # Falla ante cualquier vulnerabilidad alta o crítica nueva en lo que se
      # despliega. Las excepciones aceptadas viven en el script, con su motivo.
      - run: node ../scripts/audit-gate.mjs
      - run: npm run lint
      # Las pruebas del frontend no se corrían en CI: 168 tests que existían y
      # nadie ejecutaba salvo a mano. Sin esto el job daba verde con la suite rota.
      - run: npm test
      # `npm run build` corre `tsc -b` → type-check completo del frontend.
      - run: npm run build
