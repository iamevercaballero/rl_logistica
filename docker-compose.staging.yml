# =============================================================================
# RL Logística — STAGING (VM local Hyper-V + Cloudflare Tunnel)
# Uso:
#   docker compose -f docker-compose.staging.yml --env-file .env.staging up -d --build
#
# Diferencias con docker-compose.prod.yml:
#  - No hay Caddy: TLS lo termina Cloudflare en su borde. El servicio
#    `cloudflared` abre un túnel saliente hacia Cloudflare y expone
#    frontend:8080 / backend:3000 en los hostnames públicos configurados
#    (8080 porque nginx corre sin privilegios y no puede tomar el puerto 80)
#    en el dashboard de Cloudflare Zero Trust (Networks → Tunnels →
#    Public Hostname). No requiere config.yml ni credentials.json: todo
#    el ruteo vive en el dashboard, acá solo hace falta TUNNEL_TOKEN.
#  - Se agrega el volumen `uploads_data_staging` al backend (adjuntos/
#    fotos): docker-compose.prod.yml no lo tiene, y sin esto los archivos
#    subidos por el cliente durante la prueba se perderían en cualquier
#    `--force-recreate`.
#  - Mismo criterio de seguridad que prod: db/redis sin puertos al host,
#    variables críticas (DB_SYNCHRONIZE, DB_MIGRATIONS_RUN, ALLOW_SEED,
#    NODE_ENV) fijadas acá y no sobreescribibles desde .env.staging.
# =============================================================================

services:

  # ── PostgreSQL ────────────────────────────────────────────────────────────
  db:
    image: postgres:16-alpine
    # pg_stat_statements: sin esto no hay forma de saber qué consulta está
    # costando el tiempo. La auditoría lo marcaba como pendiente y era cierto.
    # Tiene que precargarse al arranque del servidor —no alcanza con CREATE
    # EXTENSION—, y la extensión la crea la migración 1785300000000.
    #
    # `command` reemplaza el comando del servidor, no el entrypoint: la imagen
    # oficial sigue inicializando el cluster igual y termina ejecutando esto.
    command: postgres -c shared_preload_libraries=pg_stat_statements
    container_name: rl_logistica_db_staging
    restart: unless-stopped
    env_file: [.env.staging]
    environment:
      # UTC-3 fijo, NO "America/Asuncion": ese nombre depende de que el
      # tzdata bundleado en la imagen conozca la Ley 7324 (derogó el horario
      # de verano en oct/2024). postgres:16-alpine quedó con un snapshot de
      # tzdata anterior a la ley, así que CURRENT_TIMESTAMP calculaba UTC-4 en
      # los meses que antes eran "invierno" — atrasando 1h (y a veces el día)
      # todo timestamp con default de DB: movements.date/createdAt, y
      # cualquier @CreateDateColumn/@UpdateDateColumn de TypeORM en toda la
      # app. Etc/GMT+3 (el signo va invertido por convención POSIX) es UTC-3
      # fijo en cualquier versión de tzdata — mismo criterio que
      # APP_TIME_ZONE en src/common/date.ts, para que este contenedor no
      # dependa de mantener su tzdata al día.
      TZ:   Etc/GMT+3
      PGTZ: Etc/GMT+3
    volumes:
      - postgres_data_staging:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [internal]
    # Sin 'ports': la base de datos NO es accesible desde el host.
    security_opt: [ "no-new-privileges:true" ]
    cap_drop: [ ALL ]
    cap_add: [ CHOWN, DAC_OVERRIDE, FOWNER, SETGID, SETUID ]
    deploy:
      resources:
        limits:   { memory: 1g, cpus: "1.5" }
        reservations: { memory: 256m }
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "5" }

  # ── Redis ──────────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: rl_logistica_redis_staging
    restart: unless-stopped
    command: redis-server --save "" --appendonly no --maxmemory 128mb --maxmemory-policy allkeys-lru
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [internal]
    # Sin 'ports': Redis no expuesto al host.
    security_opt: [ "no-new-privileges:true" ]
    cap_drop: [ ALL ]
    cap_add: [ CHOWN, DAC_OVERRIDE, SETGID, SETUID ]
    deploy:
      resources:
        limits:   { memory: 256m, cpus: "0.5" }
        reservations: { memory: 64m }
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

  # ── Backend ───────────────────────────────────────────────────────────────
  backend:
    build:
      context: ./logistica-palets-backend
      dockerfile: Dockerfile
    container_name: rl_logistica_backend_staging
    restart: unless-stopped
    env_file: [.env.staging]
    environment:
      # ── Overrides fijos (no pueden ser cambiados desde .env.staging) ───────
      # Etc/GMT+3, no America/Asuncion — ver el comentario en el servicio `db`.
      TZ:                Etc/GMT+3
      PORT:              3000
      DB_HOST:           db
      DB_PORT:           5432
      REDIS_HOST:        redis
      REDIS_PORT:        6379
      NODE_ENV:          production
      DB_SYNCHRONIZE:    "false"     # NUNCA synchronize
      DB_MIGRATIONS_RUN: "true"      # aplica migrations al arrancar
      ALLOW_SEED:        "false"     # seed bloqueado
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "require('http').get('http://localhost:3000/api/health', r => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))"
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 40s
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - uploads_data_staging:/app/uploads
    networks: [internal]
    security_opt: [ "no-new-privileges:true" ]
    cap_drop: [ ALL ]
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    deploy:
      resources:
        limits:   { memory: 1g, cpus: "1.5" }
        reservations: { memory: 256m }
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "5" }

  # ── Frontend (React → Nginx) ───────────────────────────────────────────────
  frontend:
    build:
      context: ./logistica-palets-frontend
      dockerfile: Dockerfile
      args:
        # Estas URLs se inyectan en tiempo de build (import.meta.env)
        VITE_API_URL:  ${VITE_API_URL}
        VITE_WS_URL:   ${VITE_WS_URL}
    container_name: rl_logistica_frontend_staging
    restart: unless-stopped
    depends_on:
      - backend
    # Sin 'ports': lo expone cloudflared por la red interna.
    networks: [internal]
    security_opt: [ "no-new-privileges:true" ]
    cap_drop: [ ALL ]
    read_only: true
    # nginx sin privilegios escribe temporales y pid; con read_only necesita esto.
    tmpfs:
      - /tmp:size=16m,mode=1777
      - /var/cache/nginx:size=16m,mode=0755,uid=101,gid=101
      - /var/run:size=1m,mode=0755,uid=101,gid=101
    deploy:
      resources:
        limits:   { memory: 128m, cpus: "0.5" }
        reservations: { memory: 32m }
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

  # ── Cloudflare Tunnel (reemplaza a Caddy: TLS termina en el borde de CF) ───
  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: rl_logistica_cloudflared_staging
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${TUNNEL_TOKEN}
    depends_on:
      - backend
      - frontend
    networks: [internal]
    security_opt: [ "no-new-privileges:true" ]
    cap_drop: [ ALL ]
    read_only: true
    deploy:
      resources:
        limits:   { memory: 128m, cpus: "0.5" }
        reservations: { memory: 32m }
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

volumes:
  postgres_data_staging:
  uploads_data_staging:

networks:
  internal:
    driver: bridge
