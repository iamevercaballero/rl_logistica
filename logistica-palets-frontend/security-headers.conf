# Cabeceras de seguridad — se incluye en `server` Y en cada `location` que
# defina su propio `add_header`.
#
# No es repetición por descuido: nginx hereda los `add_header` del nivel
# superior SÓLO si el nivel actual no define ninguno. Un `location` que agrega
# un `Cache-Control` propio descarta, sin avisar, todas las cabeceras de
# seguridad del `server`. Así se servían `/index.html`, `/sw.js`,
# `/manifest.webmanifest` y todo `/assets/`: sin `X-Frame-Options` y sin
# `nosniff`.
#
# Por eso está en un archivo aparte: si mañana se agrega otro `location` con su
# propio `add_header`, la línea que hay que copiar es una sola y está a la vista.

add_header X-Frame-Options "SAMEORIGIN" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

# CSP. `__CONNECT_SRC__` lo reemplaza el Dockerfile con los orígenes reales de
# la API y del WebSocket, que ya llegan como argumentos de build.
#
# Por qué cada pieza:
#   script-src __SCRIPT_HASHES__ -> el hash del script inline que aplica el tema antes
#     del primer paint. Se calcula en el build (scripts/csp-script-hashes.mjs);
#     poner 'unsafe-inline' en su lugar vaciaria de sentido la politica.
#   style-src 'unsafe-inline' → React inyecta estilos en línea; sin esto la app
#     se ve sin formato. Es la concesión conocida de esta política.
#   fonts.googleapis / gstatic → las tipografías de la interfaz.
#   img-src blob: → los adjuntos se abren desde un Blob creado por el frontend
#     (ver RL-A-04). Sin `blob:` no se ve ninguna foto de remito.
#   object-src 'none' y frame-ancestors 'self' → cierran plugins y clickjacking;
#     `frame-ancestors` es la versión moderna de X-Frame-Options.
add_header Content-Security-Policy "default-src 'self'; script-src 'self' __SCRIPT_HASHES__; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob:; object-src 'none'; base-uri 'self'; frame-ancestors 'self'; form-action 'self'; connect-src 'self' __CONNECT_SRC__" always;
